# 得物 6.1.5.10 lf() 实际读取的系统属性，取值来自抓取设备
# (Xiaomi MI 8 / dipper, LineageOS 12) 的 getprop 快照
# assets/root/system/etc/prop.default。
#
# 只保留 lf 通过 __system_property_get 问到的键：把 1.1k 条全量塞进
# 128 KiB 的属性区会溢出（PropertyImage::add -> "property area is full"），
# 而快照里本来就不存在的键（ro.kernel.qemu、ro.boot.flash.locked 等）
# 在真机上也返回空，故意不写。
#
# gsm.version.baseband 也故意不写：lf_out_0_3263.bin 对应的真机调用
# (z=(1,1,1)) 里它是空的；prop.default 里的 baseband 是另一时刻的快照。
# 写进去会让 body 多一个 16 字节块（3279 而不是 3263）。
